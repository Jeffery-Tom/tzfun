server:
  port: 9084

spring:
  application:
    name: coupon-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      # 只保留 @SentinelResource 精准限流，关闭全局 web 拦截（规避 SB4 下 servlet 兼容风险）
      filter:
        enabled: false
  datasource:
    url: "jdbc:mysql://localhost:3306/tzfun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: tzfun-jwt-secret-key-please-change-me-32bytes-min
  expire-ms: 86400000

rocketmq:
  name-server: localhost:9876
  producer-group: tzfun-producer
  coupon:
    seckill-topic: coupon-seckill

sentinel:
  seckill-qps: 300
