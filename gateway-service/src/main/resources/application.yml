server:
  port: 9090

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user-service/**
              filters:
                - StripPrefix=1
            - id: car-service
              uri: lb://car-service
              predicates:
                - Path=/car-service/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1
            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/coupon-service/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1

jwt:
  secret: tzfun-jwt-secret-key-please-change-me-32bytes-min
  expire-ms: 86400000
