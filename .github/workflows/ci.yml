name: CI

# 每次 push / PR 自动拉 JDK21 + Maven 构建多模块，保证主干可编译（红则拦下）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven" # 自动缓存 ~/.m2，等价于手动 actions/cache

      - name: Build with Maven
        # clean verify = 编译 + 跑单元测试（各模块已补 JwtUtil/网关鉴权/订单 Outbox/用户登录/秒杀分段 单元测试）。
        # 单元测试用 Mockito 注入依赖，不依赖 Nacos/Redis/RocketMQ/MySQL，CI 环境可直接跑绿。
        run: mvn -B clean verify
