name: CI

# 每次 push / PR 自动拉 JDK21 + Maven 构建多模块，保证主干可编译（红则拦下）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven" # 自动缓存 ~/.m2，等价于手动 actions/cache

      - name: Build with Maven
        # 当前微服务模块无 src/test，CI 仅保证可编译可打包（不依赖中间件）。
        # 将来补了单元测试可改成 `mvn -B verify`（会跑 test）。
        run: mvn -B clean compile
