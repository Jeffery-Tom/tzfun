server:
  port: 9090

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user-service/**
              filters:
                - StripPrefix=1
            - id: car-service
              uri: lb://car-service
              predicates:
                - Path=/car-service/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1
            - id: coupon-service
              uri: lb://coupon-service
              predicates:
                - Path=/coupon-service/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1

jwt:
  secret: tzfun-jwt-secret-key-please-change-me-32bytes-min
  expire-ms: 86400000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: car-service
        url: /car-service/v3/api-docs
      - name: order-service
        url: /order-service/v3/api-docs
      - name: coupon-service
        url: /coupon-service/v3/api-docs
      - name: payment-service
        url: /payment-service/v3/api-docs
